<head>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="{{ .Site.Params.description }}" />
<title>{{ if ne .Title .Site.Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
<link rel="stylesheet" href="{{ "css/reset.css" | relURL }}"/>
<link rel="stylesheet" href="{{ "css/font.css" | relURL }}"/>
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}"/>
{{ if .IsHome }}
  {{ with resources.Get "sass/vendors/_admonitions.scss" }}
    {{ with . | toCSS | fingerprint }}
      <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous">
    {{ end }}
  {{ end }}
{{ end }}
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="theme-color" content="#ebdbb2">
<!--Handles the theme toggle button (dark/light mode)-->
<script>
  (() => {
    const system = matchMedia('(prefers-color-scheme: dark)');
    let savedTheme;
    try { savedTheme = localStorage.getItem('theme'); } catch {}
    let theme = savedTheme === 'light' || (savedTheme !== 'dark' && !system.matches) ? 'light' : 'dark';
    const update = () => {
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#ebdbb2' : '#282828';
      const button = document.querySelector('.theme-toggle');
      if (button) button.textContent = theme === 'light' ? 'Nox' : 'Lux';
    };
    update();
    system.addEventListener('change', () => {
      if (savedTheme === 'light' || savedTheme === 'dark') return;
      theme = system.matches ? 'dark' : 'light';
      update();
    });
    document.addEventListener('DOMContentLoaded', () => {
      const button = document.querySelector('.theme-toggle');
      update();
      button.addEventListener('click', () => {
        theme = theme === 'light' ? 'dark' : 'light';
        savedTheme = theme;
        update();
        try { localStorage.setItem('theme', theme); } catch {}
      });
    });
  })();
</script>
</head>
